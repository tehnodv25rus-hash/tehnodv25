<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Канбан-доска «Работа машин»</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
        body { background: #f4f6f9; padding: 24px; }

        .board-header {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
            margin-bottom: 24px; background: #fff; padding: 16px 24px;
            border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); gap: 12px;
        }
        .board-header h1 { font-size: 24px; font-weight: 600; color: #1a2639; }
        .board-header .stats { font-size: 14px; color: #4a5568; }
        .board-header .stats span { font-weight: 600; color: #2b6cb0; }
        .board-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: #2b6cb0; color: white; border: none; padding: 10px 20px;
            border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #1a4f7a; }
        .btn-success {
            background: #38a169; color: white; border: none; padding: 10px 20px;
            border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;
            transition: background 0.2s;
        }
        .btn-success:hover { background: #2f855a; }

        .board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            align-items: start;
        }
        .column {
            background: #eef1f5; border-radius: 12px; padding: 12px 10px;
            min-height: 200px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: background 0.2s, border 0.2s;
            border: 2px solid transparent;
        }
        .column.drag-over {
            background: #dbe4ed;
            border-color: #2b6cb0;
        }
        .column-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px;
        }
        .column-header h2 { font-size: 16px; font-weight: 600; color: #2d3748; }
        .column-header .badge {
            background: #cbd5e0; color: #1a202c; font-size: 12px; font-weight: 600;
            padding: 2px 10px; border-radius: 20px;
        }
        .column-body {
            display: flex; flex-direction: column; gap: 10px; min-height: 100px;
        }
        .empty-message {
            color: #a0aec0;
            text-align: center;
            padding: 30px 0;
            font-size: 14px;
            font-style: italic;
        }

        .card {
            background: white; border-radius: 10px; padding: 14px 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06); border-left: 4px solid #a0aec0;
            cursor: grab; transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
            user-select: none;
        }
        .card:active { cursor: grabbing; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.08); }
        .card.dragging { opacity: 0.4; }
        .card .order-id { font-weight: 700; font-size: 15px; color: #2d3748; }
        .card .manager { font-size: 13px; color: #4a5568; margin: 2px 0; }
        .card .client-line { font-size: 13px; color: #2b6cb0; margin: 2px 0; }
        .card .pickup-line { font-size: 13px; color: #718096; margin: 2px 0; }
        .card .cargo-line { font-size: 13px; color: #718096; margin: 2px 0; }
        .card .vehicle-summary { font-size: 13px; color: #2d3748; margin: 2px 0; font-weight: 500; }
        .card .cost { font-size: 15px; font-weight: 700; color: #38a169; margin: 4px 0; }
        .card .meta {
            font-size: 12px; color: #718096; margin-top: 6px;
            display: flex; justify-content: space-between; border-top: 1px solid #edf2f7; padding-top: 6px;
        }
        .card .comment { font-style: italic; color: #4a5568; font-size: 12px; }
        .card .extra-details {
            display: none;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #e2e8f0;
            font-size: 13px;
            color: #2d3748;
        }
        .card .extra-details.show { display: block; }
        .card .extra-details .label { font-weight: 500; color: #4a5568; }
        .card .extra-details .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            border-bottom: 1px solid #f7fafc;
        }
        .card .extra-details .detail-item .key { color: #4a5568; }
        .card .extra-details .detail-item .value { font-weight: 500; color: #2d3748; }
        .card .toggle-details {
            cursor: pointer;
            color: #2b6cb0;
            font-size: 12px;
            margin-top: 4px;
            display: inline-block;
        }
        .card .toggle-details:hover { text-decoration: underline; }

        .column-0 .card { border-left-color: #f6ad55; }
        .column-1 .card { border-left-color: #fbd38d; }
        .column-2 .card { border-left-color: #4299e1; }
        .column-3 .card { border-left-color: #48bb78; }
        .column-4 .card { border-left-color: #ed64a6; }
        .column-5 .card { border-left-color: #fc8181; }

        .modal-overlay {
            display: none; position: fixed; top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; border-radius: 16px; padding: 30px; max-width: 750px; width: 95%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-height: 90vh; overflow-y: auto;
        }
        .modal h2 { margin-bottom: 20px; color: #1a2639; }
        .modal h3 { margin: 16px 0 8px; font-size: 16px; color: #2d3748; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
        .modal .form-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            margin-bottom: 6px;
        }
        .modal .form-row.full { grid-template-columns: 1fr; }
        .modal label { display: block; font-weight: 500; margin-top: 6px; font-size: 14px; color: #2d3748; }
        .modal input, .modal textarea, .modal select {
            width: 100%; padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 8px;
            font-size: 14px; margin-top: 2px; transition: border 0.2s;
            background: #fff;
        }
        .modal textarea { resize: vertical; min-height: 60px; }
        .modal input:focus, .modal textarea:focus, .modal select:focus {
            outline: none; border-color: #2b6cb0; box-shadow: 0 0 0 3px rgba(43,108,176,0.1);
        }

        .vehicle-selection-block {
            background: #f7fafc;
            border-radius: 12px;
            padding: 16px;
            margin-top: 8px;
            border: 1px solid #e2e8f0;
        }
        .vehicle-selection-block .vehicle-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 4px 0;
        }
        .vehicle-selection-block .vehicle-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 12px;
            border-radius: 6px;
            background: white;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: 0.15s;
            flex-wrap: wrap;
        }
        .vehicle-selection-block .vehicle-item:hover {
            background: #edf2f7;
            border-color: #cbd5e0;
        }
        .vehicle-selection-block .vehicle-item.selected {
            background: #ebf8ff;
            border-color: #2b6cb0;
            box-shadow: 0 0 0 2px rgba(43,108,176,0.2);
        }
        .vehicle-selection-block .vehicle-item input[type="radio"] {
            margin-right: 4px;
            accent-color: #2b6cb0;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .vehicle-selection-block .vehicle-item .vname {
            font-weight: 500;
            flex: 1;
            font-size: 14px;
        }
        .vehicle-selection-block .vehicle-item .vprice {
            color: #2b6cb0;
            font-weight: 600;
            font-size: 14px;
        }

        .vehicle-selection-block .selected-vehicle-info {
            margin-top: 12px;
            padding: 12px 16px;
            background: white;
            border-radius: 8px;
            border: 1px solid #cbd5e0;
            display: none;
        }
        .vehicle-selection-block .selected-vehicle-info.visible {
            display: block;
        }
        .vehicle-selection-block .selected-vehicle-info .vehicle-name {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 4px;
        }
        .vehicle-selection-block .selected-vehicle-info .driver-select {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .vehicle-selection-block .selected-vehicle-info .driver-select select {
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            font-size: 14px;
            background: white;
        }
        .vehicle-selection-block .selected-vehicle-info .prices {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 8px;
        }
        .vehicle-selection-block .selected-vehicle-info .prices .label {
            background: #f7fafc;
            padding: 2px 10px;
            border-radius: 4px;
            display: inline-block;
        }
        .vehicle-selection-block .selected-vehicle-info .prices .label strong {
            font-weight: 700;
            color: #2d3748;
        }
        .vehicle-selection-block .selected-vehicle-info .prices .price-value {
            font-weight: 600;
            color: #2d3748;
        }
        .vehicle-selection-block .selected-vehicle-info .extra-control {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 6px 0;
            font-size: 14px;
        }
        .vehicle-selection-block .selected-vehicle-info .extra-control button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid #cbd5e0;
            background: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vehicle-selection-block .selected-vehicle-info .extra-control button:hover {
            background: #edf2f7;
        }
        .vehicle-selection-block .selected-vehicle-info .extra-control span {
            font-size: 16px;
            font-weight: 500;
            min-width: 30px;
            text-align: center;
        }
        .vehicle-selection-block .selected-vehicle-info .total-price {
            font-size: 18px;
            font-weight: 700;
            color: #38a169;
            margin-top: 6px;
            text-align: right;
            border-top: 1px solid #e2e8f0;
            padding-top: 8px;
        }

        .dynamic-fields { margin-top: 8px; padding: 8px; background: #f7fafc; border-radius: 8px; }
        .dynamic-fields .form-row { margin-bottom: 4px; }
        .cargo-dimensions {
            margin-top: 8px;
            padding: 8px;
            background: #f7fafc;
            border-radius: 8px;
        }
        .cargo-dimensions.hidden { display: none; }
        .modal .actions { display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end; }
        .modal .btn-secondary {
            background: #e2e8f0; color: #1a202c; border: none; padding: 10px 20px;
            border-radius: 8px; cursor: pointer; font-weight: 500;
        }
        .modal .btn-secondary:hover { background: #cbd5e0; }

        @media (max-width: 1024px) { .board { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 700px) { .board { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 480px) {
            .board { grid-template-columns: 1fr; }
            .board-header { flex-direction: column; align-items: stretch; }
            .board-header .actions { justify-content: stretch; }
            .board-header .btn-primary, .board-header .btn-success { width: 100%; text-align: center; }
            .modal .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="board-header">
    <h1>🚛 Канбан-доска «Работа машин»</h1>
    <div class="stats">
        Всего заказов: <span id="total-orders">0</span> &nbsp;|&nbsp;
        Машин в работе: <span id="active-machines">0</span>
    </div>
    <div class="actions">
        <button class="btn-primary" id="showModalBtn">➕ Новая карточка</button>
        <button class="btn-success" id="exportBtn">📊 Выгрузить в Excel</button>
    </div>
</div>

<div class="board" id="kanban-board"></div>

<!-- Модалка создания/редактирования -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 id="modalTitle">Новый заказ</h2>
        <form id="newCardForm">
            <div class="form-row">
                <div>
                    <label>Номер заказа (авто)</label>
                    <input type="text" id="orderNumber" readonly style="background:#f7fafc;">
                </div>
                <div>
                    <label>Время поступления (авто)</label>
                    <input type="text" id="receivedTime" readonly style="background:#f7fafc;">
                </div>
            </div>

            <label for="managerSelect">Ведущий менеджер *</label>
            <select id="managerSelect" required>
                <option value="">— Выберите —</option>
                <option value="Виктория">Виктория</option>
                <option value="Диана">Диана</option>
                <option value="Настя">Настя</option>
            </select>

            <h3>Информация о заказе</h3>
            <label for="pickupDateTime">Время и дата подачи машины *</label>
            <input type="datetime-local" id="pickupDateTime" required>

            <label for="pickupAddress">Адрес погрузки *</label>
            <input type="text" id="pickupAddress" placeholder="ул. Ленина, 5" required>

            <label for="pickupLandmark">Ориентир для водителя на погрузке</label>
            <input type="text" id="pickupLandmark" placeholder="въезд со двора, домофон 123">

            <label for="deliveryAddress">Адрес выгрузки *</label>
            <input type="text" id="deliveryAddress" placeholder="пр. Победы, 12" required>

            <label for="deliveryLandmark">Ориентир для водителя на выгрузке</label>
            <input type="text" id="deliveryLandmark" placeholder="склад №2, грузовой шлагбаум">

            <div class="form-row">
                <div>
                    <label for="clientName">Имя клиента *</label>
                    <input type="text" id="clientName" placeholder="Иван Петров" required>
                </div>
                <div>
                    <label for="clientPhone">Номер телефона клиента *</label>
                    <input type="text" id="clientPhone" placeholder="+7 999 123-45-67" required>
                </div>
            </div>

            <h3>Услуга</h3>
            <div class="form-row">
                <div>
                    <label for="cargoType">Тип груза *</label>
                    <select id="cargoType" required>
                        <option value="">— Выберите —</option>
                        <option value="Автомобиль">Автомобиль</option>
                        <option value="Грузовик">Грузовик</option>
                        <option value="Контейнер, бытовка, модуль">Контейнер, бытовка, модуль</option>
                        <option value="Спецтехника">Спецтехника</option>
                        <option value="Сыпучие">Сыпучие</option>
                        <option value="Строительный мусор">Строительный мусор</option>
                        <option value="Прочее">Прочее</option>
                        <option value="Строительные материалы">Строительные материалы</option>
                    </select>
                </div>
            </div>

            <div id="dynamicCargoFields" class="dynamic-fields"></div>

            <div class="cargo-dimensions" id="cargoDimensions">
                <div class="form-row">
                    <div>
                        <label for="cargoWeight">Вес (т)</label>
                        <input type="number" id="cargoWeight" min="0.1" max="25" step="0.1" value="1">
                    </div>
                    <div>
                        <label for="cargoLength">Длина (м)</label>
                        <input type="number" id="cargoLength" min="0.5" max="12" step="0.1" value="2">
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label for="cargoWidth">Ширина (м)</label>
                        <input type="number" id="cargoWidth" min="0.5" max="3" step="0.1" value="1.5">
                    </div>
                    <div>
                        <label for="cargoHeight">Высота (м)</label>
                        <input type="number" id="cargoHeight" min="0.3" max="3" step="0.1" value="1.2">
                    </div>
                </div>
            </div>

            <h3>Выбор транспорта</h3>
            <div class="vehicle-selection-block" id="vehicleSelection">
                <div id="vehicleListContainer" style="margin-top:4px;"></div>
                <div id="selectedVehicleInfo" class="selected-vehicle-info">
                    <div class="vehicle-name" id="selectedVehicleName"></div>
                    <div class="driver-select">
                        <span>Водитель:</span>
                        <select id="driverSelect"></select>
                    </div>
                    <div class="prices" id="selectedPricesContainer"></div>
                    <div class="extra-control">
                        <span>Доп. часы:</span>
                        <button type="button" id="extraMinus">−</button>
                        <span id="extraHoursDisplay">0</span>
                        <button type="button" id="extraPlus">+</button>
                    </div>
                    <div class="total-price">Итого: <span id="totalPriceDisplay">0</span> ₽</div>
                </div>
            </div>

            <label for="comment">Комментарий</label>
            <textarea id="comment" rows="2" placeholder="Дополнительная информация"></textarea>

            <label for="salesChannel">Канал продаж</label>
            <select id="salesChannel">
                <option value="">— Выберите —</option>
                <option value="Яндекс">Яндекс</option>
                <option value="2ГИС">2ГИС</option>
                <option value="Фарпост">Фарпост</option>
                <option value="Интернет">Интернет</option>
                <option value="Водитель">Водитель</option>
                <option value="Дали номер">Дали номер</option>
            </select>

            <div class="actions">
                <button type="button" class="btn-secondary" id="closeModalBtn">Отмена</button>
                <button type="submit" class="btn-primary" id="submitBtn">Создать</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ------------------------------------------------------------
    // 1. Автопарк
    // ------------------------------------------------------------
    const fleet = [
        { id: 1, driver: 'Примаченко В.Л.', plate: 'У 075 НХ 125', brand: 'Мицубиси Фусо', typeName: '5т, кму 3т', capacity: 5, prices: { city5: { base: 8000, extra: 4000 }, cityCash: { base: 7000, extra: 3000 }, city20: { base: 9600, extra: 4800 } } },
        { id: 2, driver: 'Маслов А.Н.', plate: 'А 285 КА 125', brand: 'Исузу Форвард', typeName: '5т, кму 3т', capacity: 5, prices: { city5: { base: 8000, extra: 4000 }, cityCash: { base: 7000, extra: 3000 }, city20: { base: 9600, extra: 4800 } } },
        { id: 3, driver: 'Бердов А.А.', plate: 'А 278 НМ 125', brand: 'Мицубиси Фусо', typeName: '10т, кму 3т', capacity: 10, prices: { city5: { base: 14000, extra: 5500 }, cityCash: { base: 13000, extra: 4500 }, city20: { base: 16800, extra: 6600 } } },
        { id: 4, driver: '(без водителя)', plate: 'С 937 ЕС 125', brand: 'Мицубиси Фусо Файтер', typeName: '7т, кму 3т', capacity: 7, prices: { city5: { base: 11000, extra: 5000 }, cityCash: { base: 10000, extra: 4000 }, city20: { base: 13200, extra: 6000 } } },
        { id: 5, driver: '(без водителя)', plate: 'К 166 ЕХ 125', brand: 'Мицубиси Фусо Файтер', typeName: '7т, кму 3т', capacity: 7, prices: { city5: { base: 11000, extra: 5000 }, cityCash: { base: 10000, extra: 4000 }, city20: { base: 13200, extra: 6000 } } },
        { id: 6, driver: '(без водителя)', plate: 'Х 875 ВЕ 125', brand: 'Hyundai', typeName: '12т, кму 5т', capacity: 12, prices: { city5: { base: 16000, extra: 6000 }, cityCash: { base: 15000, extra: 5000 }, city20: { base: 19200, extra: 7200 } } },
        { id: 7, driver: 'Ильенко А.В.', plate: 'К 157 ТР 125', brand: 'Исузу Гига (V355)', typeName: '12т, кму 5т', capacity: 12, prices: { city5: { base: 16000, extra: 6000 }, cityCash: { base: 15000, extra: 5000 }, city20: { base: 19200, extra: 7200 } } },
        { id: 8, driver: 'Курносов Ф.В.', plate: 'А 464 ЕУ 125', brand: 'Мицубиси Фусо', typeName: '12т, кму 5т', capacity: 12, prices: { city5: { base: 16000, extra: 6000 }, cityCash: { base: 15000, extra: 5000 }, city20: { base: 19200, extra: 7200 } } },
        { id: 9, driver: '(без водителя)', plate: 'О 508 ХВ 125', brand: 'Исузу Гига', typeName: '15т (без прайса)', capacity: 15, prices: null },
        { id: 10, driver: 'Гуменный С.А.', plate: 'М 648 УХ 125', brand: 'DONGFENG', typeName: 'тягач с траллом 25т', capacity: 25, prices: { city5: { base: 22000, extra: 3000 }, cityCash: { base: 21000, extra: 2000 }, city20: { base: 26400, extra: 3600 } } },
        { id: 11, driver: 'Гуменный С.А.', plate: 'М 648 УХ 125', brand: 'DONGFENG', typeName: 'тягач с бортовой платформой 25т', capacity: 25, prices: { city5: { base: 15000, extra: 2500 }, cityCash: { base: 14000, extra: 1500 }, city20: { base: 18000, extra: 3000 } } },
        { id: 12, driver: '(без водителя)', plate: '—', brand: '—', typeName: 'самосвал 5т', capacity: 5, prices: { city5: { base: 14000, extra: 3500 }, cityCash: { base: 13000, extra: 2500 }, city20: { base: 16800, extra: 4200 } } },
        { id: 13, driver: '(без водителя)', plate: 'В 817 ВС 125', brand: 'Бонго', typeName: 'самосвал 1т', capacity: 1, prices: null },
        { id: 14, driver: '(без водителя)', plate: 'Т 933 ХТ 125', brand: 'Дюна', typeName: 'самосвал 1,3т', capacity: 1.3, prices: null }
    ];

    const allDrivers = [...new Set(fleet.map(v => v.driver).filter(d => d))];

    // ------------------------------------------------------------
    // 2. Колонки
    // ------------------------------------------------------------

    // ------------------------------------------------------------
    function formatCargoDetails(details) {
        if (!details || Object.keys(details).length === 0) return '<span style="color:#a0aec0;">—</span>';
        const labels = {
            autoType: 'Тип авто',
            brand: 'Марка',
            condition: 'Состояние',
            wheels: 'Колёса крутятся',
            loading: 'Тип погрузки',
            access: 'Подъездные пути',
            obstacles: 'Деревья/провода',
            docs: 'Документы',
            bodyType: 'Тип кузова',
            loadStatus: 'Груз в кузове',
            containerType: 'Тип контейнера',
            quantity: 'Количество',
            innerLoad: 'Груз внутри',
            protrusions: 'Выступающие элементы',
            protrusionDetails: 'Уточнение',
            equipType: 'Тип спецтехники',
            material: 'Материал',
            cargoName: 'Наименование груза',
            cargoDesc: 'Описание груза',
            special: 'Особые условия',
            extra: 'Дополнительно',
        };
        let html = '<div style="margin-top:4px;">';
        for (const [key, value] of Object.entries(details)) {
            if (!value) continue;
            const label = labels[key] || key;
            html += `<div class="detail-item"><span class="key">${label}</span><span class="value">${value}</span></div>`;
        }
        html += '</div>';
        return html;
    }

    // ------------------------------------------------------------
    // 4. Рендеринг доски – карточка теперь показывает клиента, погрузку и параметры груза
    // ------------------------------------------------------------
    function renderBoard() {
        const board = document.getElementById('kanban-board');
        board.innerHTML = '';
        let totalOrders = 0, activeMachines = 0;
        columnsData.forEach((col, index) => {
            const colDiv = document.createElement('div');
            colDiv.className = `column column-${index}`;
            colDiv.dataset.columnId = col.id;
            const header = document.createElement('div');
            header.className = 'column-header';
            header.innerHTML = `<h2>${col.name}</h2><span class="badge">${col.cards.length} / ${col.wipLimit}</span>`;
            colDiv.appendChild(header);
            const body = document.createElement('div');
            body.className = 'column-body';

            if (col.cards.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'empty-message';
                emptyMsg.textContent = 'Нет заказов';
                body.appendChild(emptyMsg);
            } else {
                col.cards.forEach(cardData => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.draggable = true;
                    card.dataset.cardId = cardData.id;
                    card.dataset.sourceColumn = col.id;
                    card.addEventListener('dblclick', function(e) {
                        e.stopPropagation();
                        editCard(cardData.id);
                    });

                    // Менеджер
                    const managerHtml = cardData.manager && cardData.manager !== '—' ? `<div class="manager">👤 Менеджер: ${cardData.manager}</div>` : '';

                    // Клиент
                    const clientLine = cardData.clientName && cardData.clientName !== '—' ? `<div class="client-line">👤 Клиент: ${cardData.clientName} | 📞 ${cardData.clientPhone}</div>` : '';

                    // Адрес погрузки
                    const pickupLine = cardData.pickupAddress && cardData.pickupAddress !== '—' ? `<div class="pickup-line">📍 Погрузка: ${cardData.pickupAddress}</div>` : '';

                    // Параметры груза (тип + вес/габариты)
                    let cargoParams = '';
                    if (cardData.cargoWeight > 0 || cardData.cargoLength > 0 || cardData.cargoWidth > 0 || cardData.cargoHeight > 0) {
                        cargoParams = ` (${cardData.cargoWeight}т, ${cardData.cargoLength}x${cardData.cargoWidth}x${cardData.cargoHeight}м)`;
                    }
                    const cargoLine = cardData.cargoType && cardData.cargoType !== '—' ? `<div class="cargo-line">📦 Груз: ${cardData.cargoType}${cargoParams}</div>` : '';

                    // Транспорт
                    const vehicleHtml = cardData.vehicleName ? `<div class="vehicle-summary">🚛 ${cardData.selectedDriver || ''} — ${cardData.vehicleName}</div>` : '';

                    // Цена
                    const costHtml = cardData.totalPrice ? `<div class="cost">💰 ${cardData.totalPrice.toLocaleString()} ₽</div>` : '';

                    // Дата/время подачи для отображения в подробностях
                    let pickupDisplay = cardData.pickupDateTime || '—';
                    if (pickupDisplay && pickupDisplay.includes('T')) {
                        const d = new Date(pickupDisplay);
                        pickupDisplay = d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    }

                    // Детали груза (для подробностей)
                    const detailsHtml = formatCargoDetails(cardData.cargoDetails || {});

                    // Блок "Подробнее" – теперь в нём только то, чего нет на карточке
                    const extraDetails = `
                        <div class="extra-details" id="extra-${cardData.id}">
                            <div><span class="label">Время подачи:</span> ${pickupDisplay}</div>
                            <div><span class="label">Выгрузка:</span> ${cardData.deliveryAddress || '—'} (ориентир: ${cardData.deliveryLandmark || '—'})</div>
                            <div><span class="label">Ориентир погрузки:</span> ${cardData.pickupLandmark || '—'}</div>
                            <div><span class="label">Детали груза:</span> ${detailsHtml}</div>
                            <div><span class="label">Водитель:</span> ${cardData.selectedDriver || '—'}</div>
                            <div><span class="label">Доп. часы:</span> ${cardData.extraHours || 0}</div>
                            <div><span class="label">Канал продаж:</span> ${cardData.salesChannel || '—'}</div>
                            <div><span class="label">Комментарий:</span> ${cardData.comment || '—'}</div>
                        </div>
                    `;

                    card.innerHTML = `
                        <div class="order-id">Заказ №${cardData.orderNumber}</div>
                        ${managerHtml}
                        ${clientLine}
                        ${pickupLine}
                        ${cargoLine}
                        ${vehicleHtml}
                        ${costHtml}
                        ${extraDetails}
                        <div class="meta">
                            <span>${cardData.statusTime || ''}</span>
                            <span class="toggle-details" data-card-id="${cardData.id}">▶ Подробнее</span>
                        </div>
                    `;

                    card.querySelector('.toggle-details').addEventListener('click', function(e) {
                        e.stopPropagation();
                        const extra = document.getElementById(`extra-${this.dataset.cardId}`);
                        if (extra) {
                            extra.classList.toggle('show');
                            this.textContent = extra.classList.contains('show') ? '▲ Скрыть' : '▶ Подробнее';
                        }
                    });

                    card.addEventListener('dragstart', handleDragStart);
                    card.addEventListener('dragend', handleDragEnd);
                    body.appendChild(card);

                    // Статистика
                    if (col.id !== 'col4' && col.id !== 'col5') {
                        if (cardData.vehicleId) activeMachines++;
                    }
                    if (cardData.orderNumber && cardData.orderNumber !== '—') totalOrders++;
                });
            }
            colDiv.appendChild(body);
            colDiv.addEventListener('dragover', handleDragOver);
            colDiv.addEventListener('dragenter', handleDragEnter);
            colDiv.addEventListener('dragleave', handleDragLeave);
            colDiv.addEventListener('drop', handleDrop);
            board.appendChild(colDiv);
        });
        document.getElementById('total-orders').textContent = totalOrders;
        document.getElementById('active-machines').textContent = activeMachines;
    }

    // ------------------------------------------------------------
    // 5. Drag & Drop
    // ------------------------------------------------------------
    let dragCounter = 0;
    function handleDragStart(e) {
        const card = e.target.closest('.card');
        if (!card) return;
        const data = { cardId: card.dataset.cardId, sourceCol: card.dataset.sourceColumn };
        e.dataTransfer.setData('text/plain', JSON.stringify(data));
        e.dataTransfer.effectAllowed = 'move';
        card.classList.add('dragging');
    }
    function handleDragEnd(e) {
        const card = e.target.closest('.card');
        if (card) card.classList.remove('dragging');
        document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
        dragCounter = 0;
    }
    function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
    }
    function handleDragEnter(e) {
        e.preventDefault();
        const col = e.target.closest('.column');
        if (!col) return;
        dragCounter++;
        col.classList.add('drag-over');
    }
    function handleDragLeave(e) {
        const col = e.target.closest('.column');
        if (!col) return;
        dragCounter--;
        if (dragCounter <= 0) {
            col.classList.remove('drag-over');
            dragCounter = 0;
        }
    }
    function handleDrop(e) {
        e.preventDefault();
        const targetCol = e.target.closest('.column');
        if (!targetCol) return;
        document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
        dragCounter = 0;
        const rawData = e.dataTransfer.getData('text/plain');
        if (!rawData) return;
        const { cardId, sourceCol } = JSON.parse(rawData);
        const targetColId = targetCol.dataset.columnId;
        if (sourceCol === targetColId) return;
        const srcCol = columnsData.find(c => c.id === sourceCol);
        const tgtCol = columnsData.find(c => c.id === targetColId);
        if (!srcCol || !tgtCol) return;
        const cardIndex = srcCol.cards.findIndex(c => c.id === cardId);
        if (cardIndex === -1) return;
        const [movedCard] = srcCol.cards.splice(cardIndex, 1);
        tgtCol.cards.push(movedCard);
        const now = new Date();
        movedCard.statusTime = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        renderBoard();
    }

    function updateDimensionsVisibility() {
        const type = cargoType.value;
        if (type === 'Автомобиль' || type === 'Грузовик') {

        }

    function updateContainerDimensions() {
        const type = document.getElementById('dyn_containerType');
        const quantity = document.getElementById('dyn_quantity');
        if (!type || !quantity) return;
        const containerType = type.value;
        const qty = parseInt(quantity.value) || 1;
        if (containerType === 'Другой') return;
        const data = containerData[containerType];
        if (!data) return;
        let finalQty = Math.min(qty, data.maxQuantity);
        if (quantity.value != finalQty) quantity.value = finalQty;
        cargoWeight.value = data.weight * finalQty;
        cargoLength.value = data.length * finalQty;
        cargoWidth.value = data.width;
        cargoHeight.value = data.height;
        updateVehicleList();
    }

                    <select id="dyn_loading"><option value="Заеду сам">Заеду сам</option><option value="Затянуть лебедкой">Затянуть лебедкой</option><option value="Поднять/спустить краном">Поднять/спустить краном</option></select>
                    <label>Подъездные пути</label>
                    <select id="dyn_access"><option value="Без проблем">Без проблем</option><option value="Узкие улицы">Узкие улицы</option><option value="Сильные перепады высот">Сильные перепады высот</option></select>
                    <label>Деревья/провода над техникой</label>
                    <select id="dyn_obstacles"><option value="Нет">Нет</option><option value="Есть">Есть</option><option value="Есть, но не мешают крану">Есть, но не мешают крану</option></select>
                    <label>Документы на технику</label>
                    <select id="dyn_docs"><option value="Предоставлю">Предоставлю</option><option value="Отсутствуют">Отсутствуют</option></select>
                `;
                break;
            case 'Сыпучие':
                html += `
                    <label>Тип материала</label>
                    <select id="dyn_material"><option value="Песок">Песок</option><option value="Щебень">Щебень</option><option value="Гравий">Гравий</option><option value="Удобрения">Удобрения</option><option value="Другое">Другое</option></select>
                `;
                break;
            case 'Строительный мусор':
                html += `
                    <label>Тип материала</label>
                    <select id="dyn_material"><option value="Бетон">Бетон</option><option value="Кирпич">Кирпич</option><option value="Древесина">Древесина</option><option value="Металл">Металл</option><option value="Смешанный">Смешанный</option><option value="Другое">Другое</option></select>
                `;
                break;
            case 'Прочее':
                html += `
                    <label>Наименование груза</label>
                    <input type="text" id="dyn_cargoName" placeholder="Наименование">
                    <label>Описание груза</label>
                    <textarea id="dyn_cargoDesc" rows="2" placeholder="Краткое описание"></textarea>
                    <label>Особые условия</label>
                    <textarea id="dyn_special" rows="2" placeholder="Хрупкое, негабаритное и т.д."></textarea>
                `;
                break;
            case 'Строительные материалы':
                html += `
                    <label>Тип материала</label>
                    <input type="text" id="dyn_material" placeholder="Например, кирпич, арматура">
                    <label>Дополнительно</label>
                    <input type="text" id="dyn_extra" placeholder="Особенности">
                `;
                break;
            default: break;
        }
        html += '</div>';
        dynamicContainer.innerHTML = html;

        if (type === 'Контейнер, бытовка, модуль') {
            const containerType = document.getElementById('dyn_containerType');
            const quantity = document.getElementById('dyn_quantity');
            if (containerType) {
                containerType.addEventListener('change', () => {
                    const data = containerData[containerType.value];
                    const qtySelect = document.getElementById('dyn_quantity');
                    if (qtySelect && data) {
                        const options = qtySelect.options;
                        for (let i = 0; i < options.length; i++) {
                            options[i].disabled = parseInt(options[i].value) > data.maxQuantity;
                        }
                        if (parseInt(qtySelect.value) > data.maxQuantity) qtySelect.value = '1';
                    }
                    updateContainerDimensions();
                });
                if (quantity) quantity.addEventListener('change', updateContainerDimensions);
                setTimeout(updateContainerDimensions, 50);
            }
        }
    }

    function getCargoDetails() {
        const details = {};
        const container = dynamicContainer;
        if (!container) return details;
        const inputs = container.querySelectorAll('[id^="dyn_"]');
        inputs.forEach(el => {
            const key = el.id.replace('dyn_', '');
            details[key] = el.value;
        });
        return details;
    }

    // ------------------------------------------------------------
    // Обновление списка транспорта – для Сыпучих только самосвалы
    // ------------------------------------------------------------
    function updateVehicleList() {
        const type = cargoType.value;
        if (!type) {
            vehicleListContainer.innerHTML = '<p style="color:#a0aec0; font-size:14px;">Выберите тип груза для подбора транспорта.</p>';
            selectedVehicleInfo.classList.remove('visible');
            selectedVehicle = null;
            selectedDriver = null;
            return;
        }

        const weight = parseFloat(cargoWeight.value) || 0;
        let filtered = fleet.filter(v => v.prices !== null && weight <= v.capacity);

        if (type === 'Сыпучие') {
            filtered = filtered.filter(v => v.typeName.toLowerCase().includes('самосвал'));
        }

        if (filtered.length === 0) {
            vehicleListContainer.innerHTML = '<p style="color:#e53e3e; font-size:14px;">Нет подходящего транспорта с указанными ценами. Измените вес груза.</p>';
            selectedVehicleInfo.classList.remove('visible');
            selectedVehicle = null;
            selectedDriver = null;
            return;
        }

        let html = '<div class="vehicle-list">';
        filtered.forEach((v, index) => {
            const checked = (selectedVehicle && selectedVehicle.id === v.id) ? 'checked' : (index === 0 ? 'checked' : '');
            const displayName = `${v.plate}, ${v.brand} (${v.typeName})`;
            html += `
                <label class="vehicle-item" data-id="${v.id}">
                    <input type="radio" name="vehicle" value="${v.id}" data-vehicle='${JSON.stringify(v)}' ${checked}>
                    <span class="vname">${displayName}</span>
                    <span class="vprice">${v.prices.cityCash.base.toLocaleString()} ₽</span>
                </label>
            `;
        });
        html += '</div>';
        vehicleListContainer.innerHTML = html;

        const radios = vehicleListContainer.querySelectorAll('input[name="vehicle"]');
        radios.forEach(radio => {
            radio.addEventListener('change', function() {
                const v = JSON.parse(this.dataset.vehicle);
                selectVehicle(v);
                document.querySelectorAll('.vehicle-item').forEach(el => el.classList.remove('selected'));
                this.closest('.vehicle-item').classList.add('selected');
            });
        });

        if (selectedVehicle) {
            const radioToCheck = Array.from(radios).find(r => JSON.parse(r.dataset.vehicle).id === selectedVehicle.id);
            if (radioToCheck) {
                radioToCheck.checked = true;
                document.querySelectorAll('.vehicle-item').forEach(el => el.classList.remove('selected'));
                radioToCheck.closest('.vehicle-item').classList.add('selected');
            } else {
                const firstRadio = vehicleListContainer.querySelector('input[name="vehicle"]');
                if (firstRadio) {
                    const v = JSON.parse(firstRadio.dataset.vehicle);
                    selectVehicle(v);
                    firstRadio.checked = true;
                    firstRadio.closest('.vehicle-item').classList.add('selected');
                }
            }
        } else {
            const firstRadio = vehicleListContainer.querySelector('input[name="vehicle"]');
            if (firstRadio) {
                const v = JSON.parse(firstRadio.dataset.vehicle);
                selectVehicle(v);
                firstRadio.checked = true;
                firstRadio.closest('.vehicle-item').classList.add('selected');
            }
        }
    }

    // ------------------------------------------------------------
    // Выбор транспорта
    // ------------------------------------------------------------
    function selectVehicle(v) {
        selectedVehicle = v;
        selectedDriver = v.driver;

        const vehicleDisplay = `${v.plate}, ${v.brand} (${v.typeName})`;
        selectedVehicleName.textContent = vehicleDisplay;

        driverSelect.innerHTML = '';
        allDrivers.forEach(driver => {
            const option = document.createElement('option');
            option.value = driver;
            option.textContent = driver;
            if (driver === selectedDriver) option.selected = true;
            driverSelect.appendChild(option);
        });
        driverSelect.onchange = function() {
            selectedDriver = this.value;
        };

        const prices = v.prices;
        let pricesHtml = '';
        if (prices) {
            const variants = [
                { key: 'cityCash', label: 'Наличные' },
                { key: 'city5', label: '5%' },
                { key: 'city20', label: '20%' }
            ];
            variants.forEach(variant => {
                const price = prices[variant.key];
                if (price) {
                    const isActive = (variant.key === 'cityCash');
                    pricesHtml += `
                        <div class="label" style="${isActive ? 'background:#ebf8ff; border-left:3px solid #2b6cb0;' : ''}">
                            <strong>${isActive ? '👉 ' : ''}${variant.label}:</strong>
                            <span class="price-value">${price.base.toLocaleString()} / ${price.extra.toLocaleString()} ₽</span>
                            (база / доп. час)
                            ${isActive ? ' <span style="color:#2b6cb0; font-weight:600;">(используется для расчёта)</span>' : ''}
                        </div>
                    `;
                }
            });
        }
        selectedPricesContainer.innerHTML = pricesHtml;

        const base = prices.cityCash.base;
        const extra = prices.cityCash.extra;
        window._selectedBasePrice = base;
        window._selectedExtraPrice = extra;

        updateTotalPrice();
        selectedVehicleInfo.classList.add('visible');
    }

    function updateTotalPrice() {
        if (!selectedVehicle) return;
        const base = window._selectedBasePrice || 0;
        const extra = window._selectedExtraPrice || 0;
        const total = base + extraHours * extra;
        totalPriceDisplay.textContent = total.toLocaleString();
    }

    extraMinus.addEventListener('click', () => {
        if (extraHours > 0) { extraHours--; extraHoursDisplay.textContent = extraHours; updateTotalPrice(); }
    });
    extraPlus.addEventListener('click', () => {
        if (extraHours < 10) { extraHours++; extraHoursDisplay.textContent = extraHours; updateTotalPrice(); }
    });

    cargoType.addEventListener('change', () => {
        renderDynamicFields();
        updateDimensionsVisibility();
        updateVehicleList();
    });
    cargoWeight.addEventListener('input', updateVehicleList);
    [cargoLength, cargoWidth, cargoHeight].forEach(input => {
        input.addEventListener('input', updateVehicleList);
    });

    // ------------------------------------------------------------
    // 7. Экспорт в Excel
    // ------------------------------------------------------------
    document.getElementById('exportBtn').addEventListener('click', function() {
        const rows = [];
        const headers = [
            'Номер заказа', 'Менеджер', 'Время поступления', 'Дата/время подачи',
            'Адрес погрузки', 'Ориентир погрузки', 'Адрес выгрузки', 'Ориентир выгрузки',
            'Клиент', 'Телефон', 'Тип груза', 'Вес (т)', 'Длина (м)', 'Ширина (м)', 'Высота (м)',
            'Детали груза', 'Транспорт (госномер, марка, тип)', 'Водитель',
            'Базовая цена (₽)', 'Доп. часы', 'Итоговая цена (₽)',
            'Канал продаж', 'Комментарий', 'Статус', 'Время статуса'
        ];
        rows.push(headers);

        columnsData.forEach(col => {
            col.cards.forEach(card => {
                let detailsStr = '';
                if (card.cargoDetails) {
                    const labels = {
                        autoType: 'Тип авто',
                        brand: 'Марка',
                        condition: 'Состояние',
                        wheels: 'Колёса крутятся',
                        loading: 'Тип погрузки',
                        access: 'Подъездные пути',
                        obstacles: 'Деревья/провода',
                        docs: 'Документы',
                        bodyType: 'Тип кузова',
                        loadStatus: 'Груз в кузове',
                        containerType: 'Тип контейнера',
                        quantity: 'Количество',
                        innerLoad: 'Груз внутри',
                        protrusions: 'Выступающие элементы',
                        protrusionDetails: 'Уточнение',
                        equipType: 'Тип спецтехники',
                        material: 'Материал',
                        cargoName: 'Наименование груза',
                        cargoDesc: 'Описание груза',
                        special: 'Особые условия',
                        extra: 'Дополнительно'
                    };
                    const parts = [];
                    for (const [key, value] of Object.entries(card.cargoDetails)) {
                        if (value) {
                            const label = labels[key] || key;
                            parts.push(`${label}: ${value}`);
                        }
                    }
                    detailsStr = parts.join('; ');
                }

                const row = [
                    card.orderNumber || '',
                    card.manager || '',
                    card.receivedTime || '',
                    card.pickupDateTime ? new Date(card.pickupDateTime).toLocaleString('ru-RU') : '',
                    card.pickupAddress || '',
                    card.pickupLandmark || '',
                    card.deliveryAddress || '',
                    card.deliveryLandmark || '',
                    card.clientName || '',
                    card.clientPhone || '',
                    card.cargoType || '',
                    card.cargoWeight || 0,
                    card.cargoLength || 0,
                    card.cargoWidth || 0,
                    card.cargoHeight || 0,
                    detailsStr,
                    card.vehicleName || '',
                    card.selectedDriver || '',
                    card.vehiclePrice || 0,
                    card.extraHours || 0,
                    card.totalPrice || 0,
                    card.salesChannel || '',
                    card.comment || '',
                    col.name.replace(/[📞📥🚛✅❌🏠]/g, '').trim(),
                    card.statusTime || ''
                ];
                rows.push(row);
            });
        });

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(rows);
        XLSX.utils.book_append_sheet(wb, ws, 'Заказы');
        const now = new Date();
        const dateStr = now.toISOString().slice(0,10).replace(/-/g,'');
        const filename = `заказы_${dateStr}.xlsx`;
        XLSX.writeFile(wb, filename);
    });

    // ------------------------------------------------------------
    // 8. Отправка формы (создание/обновление)
    // ------------------------------------------------------------
    form.addEventListener('submit', (e) => {
        e.preventDefault();

        if (!managerSelect.value) { alert('Выберите менеджера.'); return; }
        if (!pickupDateTime.value) { alert('Укажите дату и время подачи.'); return; }
        if (!pickupAddress.value.trim() || !deliveryAddress.value.trim()) {
            alert('Заполните адреса погрузки и выгрузки.'); return;
        }
        if (!clientName.value.trim() || !clientPhone.value.trim()) {
            alert('Заполните имя и телефон клиента.'); return;
        }
        if (!cargoType.value) { alert('Выберите тип груза.'); return; }
        if (!selectedVehicle) { alert('Выберите транспорт.'); return; }

        const cargoDetails = getCargoDetails();
        const now = new Date();
        const statusTime = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

        const base = window._selectedBasePrice || 0;
        const extra = window._selectedExtraPrice || 0;
        const total = base + extraHours * extra;

        const vehicleDisplay = `${selectedVehicle.plate}, ${selectedVehicle.brand} (${selectedVehicle.typeName})`;

        const cardData = {
            id: editingCardId ? editingCardId : 'c' + (nextCardId++),
            orderNumber: editingCardId ? document.getElementById('orderNumber').value : String(nextOrderNumber++),
            manager: managerSelect.value,
            receivedTime: receivedTimeInput.value,
            pickupDateTime: pickupDateTime.value,
            pickupAddress: pickupAddress.value.trim(),
            pickupLandmark: pickupLandmark.value.trim() || '—',
            deliveryAddress: deliveryAddress.value.trim(),
            deliveryLandmark: deliveryLandmark.value.trim() || '—',
            clientName: clientName.value.trim(),
            clientPhone: clientPhone.value.trim(),
            cargoType: cargoType.value,
            cargoWeight: parseFloat(cargoWeight.value) || 0,
            cargoLength: parseFloat(cargoLength.value) || 0,
            cargoWidth: parseFloat(cargoWidth.value) || 0,
            cargoHeight: parseFloat(cargoHeight.value) || 0,
            cargoDetails: cargoDetails,
            vehicleId: selectedVehicle.id,
            selectedDriver: selectedDriver || selectedVehicle.driver,
            vehicleName: vehicleDisplay,
            vehiclePrice: base,
            extraHours: extraHours,
            totalPrice: total,
            comment: commentInput.value.trim() || '—',
            salesChannel: salesChannel.value || '—',
            statusTime: statusTime
        };

        if (editingCardId) {
            for (const col of columnsData) {
                const idx = col.cards.findIndex(c => c.id === editingCardId);
                if (idx !== -1) {
                    col.cards[idx] = cardData;
                    break;
                }
            }
            editingCardId = null;
        } else {
            columnsData[0].cards.push(cardData);
        }

        closeModal();
        renderBoard();
    });

    // ------------------------------------------------------------
    // 9. Запуск
    // ------------------------------------------------------------
    renderBoard();
    setTimeout(() => {
        renderDynamicFields();
        updateDimensionsVisibility();
        if (cargoType.value === 'Контейнер, бытовка, модуль') updateContainerDimensions();
        updateVehicleList();
    }, 100);
</script>
</body>
</html>
